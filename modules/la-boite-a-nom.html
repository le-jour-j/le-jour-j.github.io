<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les Boîtes à Noms</title>
    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #666;
            --accent: #4a90e2;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-weight: normal;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Indice visuel qu'il y a du contenu à faire défiler plus bas :
           sans ça, sur mobile, la catégorie "Groupes" seule à l'écran ne
           laisse rien deviner des 3 autres catégories en dessous. */
        .scroll-hint {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 64px;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.65));
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s ease;
            z-index: 50;
        }

        .scroll-hint.visible {
            opacity: 1;
        }

        .box {
            background: var(--container-bg);
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            min-height: 300px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .box h2 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.1rem;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .input-group {
            display: flex;
            gap: 5px;
            margin: 15px 0;
        }

        input {
            flex: 1;
            padding: 8px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
        }

        button.add-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            flex: 1;
        }

        li {
            background: #2a2a2a;
            margin-bottom: 5px;
            padding: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
        }

        li:hover {
            background: #333;
        }

        li.used {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .del-btn {
            background: none;
            border: 1px solid #ff4757;
            color: #ff4757;
            font-size: 0.7rem;
            padding: 2px 5px;
            cursor: pointer;
            border-radius: 3px;
        }

        /* Animation Arc-en-ciel */
        body.rainbow-active {
            animation: rainbowBg 0.8s;
        }

        @keyframes rainbowBg {
            0% {
                background: #ff0000;
            }

            20% {
                background: #ffff00;
            }

            40% {
                background: #00ff00;
            }

            60% {
                background: #00ffff;
            }

            80% {
                background: #0000ff;
            }

            100% {
                background: var(--bg-color);
            }
        }
    </style>
</head>

<body>

    <h1>Boîtes à Noms</h1>

    <div class="grid">
        <div class="box" id="box-groupes">
            <h2>Groupes</h2>
            <div class="input-group">
                <input type="text" placeholder="Ajouter...">
                <button class="add-btn">OK</button>
            </div>
            <ul></ul>
        </div>

        <div class="box" id="box-prenoms">
            <h2>Prénoms</h2>
            <div class="input-group">
                <input type="text" placeholder="Ajouter...">
                <button class="add-btn">OK</button>
            </div>
            <ul></ul>
        </div>

        <div class="box" id="box-oiseaux">
            <h2>Oiseaux</h2>
            <div class="input-group">
                <input type="text" placeholder="Ajouter...">
                <button class="add-btn">OK</button>
            </div>
            <ul></ul>
        </div>

        <div class="box" id="box-entreprises">
            <h2>Entreprises</h2>
            <div class="input-group">
                <input type="text" placeholder="Ajouter...">
                <button class="add-btn">OK</button>
            </div>
            <ul></ul>
        </div>
    </div>

    <div class="scroll-hint" id="scrollHint"></div>

    <script src="btm-caisse.js"></script>
    <script type="module">

        // ─── TARIFS (UL de base ; l'inflation du site est appliquée par la caisse) ──
        const COUT_DEPOT = 10;      // déposer un nom
        const COUT_RAYER = 2;       // rayer / dé-rayer un nom
        const COUT_SUPPRIMER = 25;  // radier définitivement

        function afficherRefus(texte) {
            let el = document.getElementById('btm-refus');
            if (!el) {
                el = document.createElement('div');
                el.id = 'btm-refus';
                el.style.cssText = 'position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:9999;background:#2a0810;border:1px solid #ff5570;color:#ffb0c0;padding:8px 16px;font-size:12px;font-family:sans-serif;border-radius:6px;';
                document.body.appendChild(el);
            }
            el.textContent = texte;
            el.style.display = 'block';
            clearTimeout(el._t);
            el._t = setTimeout(() => { el.style.display = 'none'; }, 4000);
        }

        // Les tarifs sont annoncés sur les boutons « OK » de chaque boîte.
        function majTarifs() {
            document.querySelectorAll('.box button').forEach(b => {
                if (b.classList.contains('del-btn')) return;
                b.textContent = 'OK' + BTM.etiquette(COUT_DEPOT);
            });
        }
        BTM.surEtat(majTarifs);
        setTimeout(majTarifs, 0);

        // ─── BANDEAU D'ÉTAT DU REGISTRE ────────────────────────────────────
        function etatRegistre(texte) {
            let el = document.getElementById('etat-registre');
            if (!el) {
                el = document.createElement('div');
                el.id = 'etat-registre';
                el.style.cssText = 'text-align:center;font-size:12px;font-family:sans-serif;padding:6px 10px;margin:0 0 12px;border-radius:6px;background:rgba(74,144,226,0.12);color:#9fc4ea;border:1px solid rgba(74,144,226,0.4);';
                const premier = document.querySelector('.box');
                if (premier && premier.parentElement) premier.parentElement.insertBefore(el, premier);
                else document.body.prepend(el);
            }
            el.textContent = texte;
        }

        // ─── REGISTRE LOCAL ────────────────────────────────────────────────
        // Décision du 12/09/2026 : pas de partage entre visiteurs. La base
        // Firebase distante est retirée (config à trous, base publique ouverte
        // en écriture à n'importe qui, mot de passe d'administration = « admin »,
        // et un import CDN dont l'échec tuait toute la page). Les noms vivent
        // dans le navigateur de celui qui les dépose.
        function creerRegistreLocal() {
            const CLE = 'btm_boites_local_v1';
            const lire = () => { try { return JSON.parse(localStorage.getItem(CLE)) || {}; } catch { return {}; } };
            const ecrire = (d) => { try { localStorage.setItem(CLE, JSON.stringify(d)); } catch { /* stockage indisponible */ } };
            const abonnes = {};
            const notifier = (id) => (abonnes[id] || []).forEach(cb => cb(lire()[id] || null));
            return {
                abonner(id, cb) { (abonnes[id] = abonnes[id] || []).push(cb); cb(lire()[id] || null); },
                ajouter(id, valeur) { const d = lire(); d[id] = d[id] || {}; d[id]['l' + Date.now() + Math.random().toString(36).slice(2, 6)] = valeur; ecrire(d); notifier(id); },
                modifier(id, cle, patch) { const d = lire(); if (d[id] && d[id][cle]) { Object.assign(d[id][cle], patch); ecrire(d); notifier(id); } },
                supprimer(id, cle) { const d = lire(); if (d[id]) { delete d[id][cle]; ecrire(d); notifier(id); } },
            };
        }

        const registre = creerRegistreLocal();
        etatRegistre("Registre personnel : les noms déposés restent dans ce navigateur.");

        function initBox(id) {
            const el = document.getElementById('box-' + id);
            const input = el.querySelector('input');
            const btn = el.querySelector('button');
            const list = el.querySelector('ul');

            // Lecture en temps réel (distante ou locale selon le registre actif)
            registre.abonner(id, (data) => {
                list.innerHTML = '';
                if (data) {
                    Object.entries(data).reverse().forEach(([key, val]) => {
                        const li = document.createElement('li');
                        li.className = val.used ? 'used' : '';
                        // Le texte vient d'un visiteur quelconque : il est
                        // inséré comme TEXTE, jamais comme HTML (XSS stockée).
                        const span = document.createElement('span');
                        span.textContent = val.text;
                        const del = document.createElement('button');
                        del.className = 'del-btn';
                        del.textContent = 'Suppr';
                        li.appendChild(span);
                        li.appendChild(del);

                        // Toggle rayé — radiation d'une dénomination : payante.
                        li.onclick = async (e) => {
                            if (e.target.tagName !== 'BUTTON') {
                                const ok = await BTM.payer("Radiation d'une dénomination", COUT_RAYER);
                                if (!ok) return afficherRefus("Radiation refusée : provision insuffisante.");
                                registre.modifier(id, key, { used: !val.used });
                            }
                        };

                        // Supprimer
                        del.onclick = async (e) => {
                            e.stopPropagation();
                            const ok = await BTM.payer("Radiation définitive — frais de dossier", COUT_SUPPRIMER);
                            if (!ok) return afficherRefus("Radiation refusée : frais de dossier impayés.");
                            registre.supprimer(id, key);
                        };
                        list.appendChild(li);
                    });
                }
            });

            // Ajouter
            const add = async () => {
                if (input.value.trim()) {
                    const ok = await BTM.payer("Dépôt d'un nom au registre — " + id, COUT_DEPOT);
                    if (!ok) return afficherRefus("Dépôt refusé : provision insuffisante.");
                    registre.ajouter(id, { text: input.value.trim(), used: false });
                    input.value = '';
                    document.body.classList.add('rainbow-active');
                    setTimeout(() => document.body.classList.remove('rainbow-active'), 800);
                }
            };
            btn.onclick = add;
            input.onkeydown = (e) => { if (e.key === 'Enter') add(); };
        }

        ['groupes', 'prenoms', 'oiseaux', 'entreprises'].forEach(initBox);

        // Affiche le dégradé tant qu'il reste du contenu à faire défiler en dessous.
        const scrollHint = document.getElementById('scrollHint');
        const updateScrollHint = () => {
            const scrollable = document.documentElement.scrollHeight - window.innerHeight;
            const remaining = scrollable - window.scrollY;
            scrollHint.classList.toggle('visible', remaining > 4);
        };
        window.addEventListener('scroll', updateScrollHint, { passive: true });
        window.addEventListener('resize', updateScrollHint);
        updateScrollHint();
    </script>
</body>

</html>
