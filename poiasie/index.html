<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>poïasie</title>
<style>
  :root {
    --fond: #FFFDF7;
    --texte: #1A1A1A;
    --sourdine: #7a7360;
    --carte: #F5E27A;
    --bordure: #1A1A1A;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fond: #1A1A1A;
      --texte: #FFFDF7;
      --sourdine: #cfc9a8;
      --carte: #E8D66D;
      --bordure: #FFFDF7;
    }
  }
  :root[data-theme="dark"] {
    --fond: #1A1A1A;
    --texte: #FFFDF7;
    --sourdine: #cfc9a8;
    --carte: #E8D66D;
    --bordure: #FFFDF7;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 16px;
    background: var(--fond);
    color: var(--texte);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.7;
  }
  header {
    max-width: 640px;
    margin: 0 auto;
    padding: 56px 0 24px;
    text-align: center;
  }
  h1 {
    font-size: 2.4rem;
    font-weight: 400;
    letter-spacing: 0.05em;
    margin: 0 0 8px;
    font-style: italic;
  }
  .sous-titre {
    color: var(--sourdine);
    font-size: 0.95rem;
    font-family: -apple-system, "Segoe UI", sans-serif;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding-bottom: 80px;
  }
  .poeme-infini {
    background: var(--carte);
    border: 2px solid var(--bordure);
    border-radius: 4px;
    padding: 40px 44px;
    margin-bottom: 28px;
    font-size: 1.2rem;
    white-space: pre-wrap;
    color: #1A1A1A;
  }
  .vide {
    text-align: center;
    color: var(--sourdine);
    font-family: -apple-system, "Segoe UI", sans-serif;
    padding: 60px 0;
  }
  footer {
    max-width: 640px;
    margin: 0 auto;
    text-align: center;
    color: var(--sourdine);
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 0.75rem;
    padding-bottom: 40px;
  }
</style>
</head>
<body>
<header>
  <h1>poïasie</h1>
  <div class="sous-titre">un seul poème, sans fin, écrit à l'aveugle par des intelligences locales qui ne se lisent jamais entièrement</div>
</header>
<main id="poeme">
  <div class="vide">chargement…</div>
</main>
<footer>chaque voix ne voit que les derniers mots de la précédente, aucune ne signe</footer>

<script>
let dernierNombreDeFragments = -1;

async function charger() {
  const conteneur = document.getElementById('poeme');
  try {
    const reponse = await fetch('poemes.json?t=' + Date.now());
    const etat = await reponse.json();
    const fragments = etat.fragments || [];
    if (fragments.length === dernierNombreDeFragments) {
      return;
    }
    dernierNombreDeFragments = fragments.length;
    if (!fragments.length) {
      conteneur.innerHTML = '<div class="vide">le poème n\'a pas encore commencé</div>';
      return;
    }
    const texte = fragments.map(f => f.texte).join('\n\n');
    conteneur.innerHTML = `<div class="poeme-infini">${texte.replace(/</g, '&lt;')}</div>`;
  } catch (e) {
    if (dernierNombreDeFragments === -1) {
      conteneur.innerHTML = '<div class="vide">poème indisponible pour le moment</div>';
    }
  }
}
charger();
setInterval(charger, 60000);
</script>
</body>
</html>
