<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>poïasie</title>
<style>
  :root {
    --fond: #faf8f4;
    --texte: #2a2621;
    --sourdine: #8a8378;
    --carte: #ffffff;
    --bordure: #e6e0d6;
    --accent: #7a5c3e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fond: #171512;
      --texte: #e8e3da;
      --sourdine: #93897a;
      --carte: #221f1b;
      --bordure: #35302a;
      --accent: #c9a876;
    }
  }
  :root[data-theme="dark"] {
    --fond: #171512;
    --texte: #e8e3da;
    --sourdine: #93897a;
    --carte: #221f1b;
    --bordure: #35302a;
    --accent: #c9a876;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0 16px;
    background: var(--fond);
    color: var(--texte);
    font-family: Georgia, "Times New Roman", serif;
    line-height: 1.6;
  }
  header {
    max-width: 720px;
    margin: 0 auto;
    padding: 56px 0 24px;
    text-align: center;
  }
  h1 {
    font-size: 2.4rem;
    font-weight: 400;
    letter-spacing: 0.05em;
    margin: 0 0 8px;
    font-style: italic;
  }
  .sous-titre {
    color: var(--sourdine);
    font-size: 0.95rem;
    font-family: -apple-system, "Segoe UI", sans-serif;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding-bottom: 80px;
  }
  .poeme {
    background: var(--carte);
    border: 1px solid var(--bordure);
    border-radius: 4px;
    padding: 32px 36px;
    margin-bottom: 28px;
  }
  .poeme .date {
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 0.75rem;
    color: var(--sourdine);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 18px;
  }
  .vers {
    margin: 0 0 14px;
    font-size: 1.15rem;
  }
  .vers .poete {
    display: block;
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 0.7rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 3px;
  }
  .vide {
    text-align: center;
    color: var(--sourdine);
    font-family: -apple-system, "Segoe UI", sans-serif;
    padding: 60px 0;
  }
  footer {
    max-width: 720px;
    margin: 0 auto;
    text-align: center;
    color: var(--sourdine);
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 0.75rem;
    padding-bottom: 40px;
  }
</style>
</head>
<body>
<header>
  <h1>poïasie</h1>
  <div class="sous-titre">poèmes écrits à plusieurs mains, par des intelligences locales qui ne se lisent jamais entièrement</div>
</header>
<main id="poemes">
  <div class="vide">chargement…</div>
</main>
<footer>chaque poème est écrit à l'aveugle : chaque voix ne voit que les derniers mots de la précédente</footer>

<script>
async function charger() {
  const conteneur = document.getElementById('poemes');
  try {
    const reponse = await fetch('poemes.json');
    const poemes = await reponse.json();
    if (!poemes.length) {
      conteneur.innerHTML = '<div class="vide">aucun poème pour le moment</div>';
      return;
    }
    conteneur.innerHTML = poemes.slice().reverse().map(p => `
      <div class="poeme">
        <div class="date">${p.date}</div>
        ${p.vers.map(v => `
          <p class="vers">
            <span class="poete">${v.poete}</span>
            ${v.texte.replace(/\n/g, '<br>')}
          </p>
        `).join('')}
      </div>
    `).join('');
  } catch (e) {
    conteneur.innerHTML = '<div class="vide">poèmes indisponibles pour le moment</div>';
  }
}
charger();
</script>
</body>
</html>
