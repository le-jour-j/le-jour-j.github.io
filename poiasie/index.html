<!DOCTYPE html>
<!-- poiasie-teaser -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>poïasie</title>
<meta name="description" content="poïasie, un instrument de poésie visuelle de Jeanson Pechin : des poèmes écrits par des machines, lus en lettres qui bougent.">
<meta property="og:title" content="poïasie">
<meta property="og:description" content="Un instrument de poésie visuelle de Jeanson Pechin : des poèmes écrits par des machines, lus en lettres qui bougent.">
<meta property="og:type" content="website">
<link rel="icon" href="/favicon.ico">
<style>
  :root {
    --fond: #05060b;
    --ligne: #0b0d16;
    --texte: #8f93a3;
    --texte-fort: #d9d6cb;
    --accent: #e8c46a;
    --teinte: 45;
    --h-ligne: 34px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fond); }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; color: var(--texte); font: 12px/1.4 Georgia, "Times New Roman", serif; }
  #scene { flex: 1 1 auto; min-height: 0; width: 100%; border: 0; display: block; background: #000; }
  #scene:fullscreen { height: 100%; }

  /* la ligne : sous l'image, jamais dessus */
  #ligne {
    flex: 0 0 auto; min-height: var(--h-ligne); display: flex; align-items: center; gap: 14px; flex-wrap: nowrap;
    padding: 4px 14px calc(4px + env(safe-area-inset-bottom)); background: var(--ligne); border-top: 1px solid #181b2a; overflow: hidden;
  }
  #ligne a { color: var(--texte-fort); text-decoration: none; border-bottom: 1px solid rgba(217,214,203,0.3); }
  #ligne a:hover, #ligne a:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }
  #legende { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #origine { flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity 1.2s; }
  #origine.vu { opacity: 1; }
  #origine i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; background: hsl(var(--teinte) 70% 62%); box-shadow: 0 0 6px hsl(var(--teinte) 80% 55% / 0.7); }
  #gestes { flex: 0 0 auto; opacity: 0.75; white-space: nowrap; }
  #gestes .g-tel { display: none; }
  kbd { font: 11px Consolas, "Courier New", monospace; color: var(--texte-fort); border: 1px solid #2a2e44; border-radius: 3px; padding: 0 4px; }
  .bouton { flex: 0 0 auto; font: inherit; color: var(--texte-fort); background: transparent; border: 1px solid #2a2e44; border-radius: 3px; padding: 1px 8px; cursor: pointer; min-height: 24px; }
  .bouton:hover, .bouton:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }
  .bouton[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  @media (max-width: 760px), (pointer: coarse) {
    #ligne { gap: 6px 10px; padding-left: 10px; padding-right: 10px; flex-wrap: wrap; }
    #origine .titre { display: none; }
    #legende { flex: 1 1 100%; white-space: normal; font-size: 11px; line-height: 1.3; }
    #gestes { flex: 1 1 100%; order: 3; white-space: normal; font-size: 11px; line-height: 1.3; opacity: 0.85; }
    #gestes .g-pc { display: none; }
    #gestes .g-tel { display: inline; }
    .bouton { min-height: 30px; padding: 2px 10px; }
    #b-suivant { order: 1; } #b-son { order: 1; } #b-plein { order: 1; } #origine { order: 2; }
  }
  @media (max-width: 460px) { #origine { display: none; } }
  noscript { position: fixed; inset: 0; display: grid; place-items: center; color: var(--texte-fort); background: var(--fond); padding: 24px; text-align: center; }
</style>
</head>
<body>
<iframe id="scene" src="scene.html?v=066797d9" title="poïasie : des poèmes en lettres qui bougent" allow="fullscreen; autoplay" allowfullscreen></iframe>
<div id="ligne">
  <span id="legende">poïasie, un instrument de poésie visuelle de <a href="../" target="_blank" rel="noopener" title="le site de Jeanson Pechin (nouvel onglet)">Jeanson Pechin</a> · <a href="infini.html" target="_blank" rel="noopener">le poème infini</a></span>
  <span id="origine" aria-live="off"></span>
  <span id="gestes"><span class="g-pc"><kbd>clic</kbd> un mot · <kbd>glisser</kbd> en écrire · <kbd>appui long</kbd> éclater · <kbd>espace</kbd> poème suivant · <kbd>S</kbd> scène · <kbd>N</kbd> couleurs</span><span class="g-tel">touchez : un mot · glissez : une phrase · appui long : éclater</span></span>
  <button class="bouton" id="b-suivant" type="button" title="poème suivant (espace)">poème suivant ›</button>
  <button class="bouton" id="b-son" type="button" aria-pressed="false" title="allumer ou couper le son (coupé au départ)">son</button>
  <button class="bouton" id="b-plein" type="button" title="plein écran (F)">plein écran</button>
</div>
<noscript>poïasie a besoin de JavaScript pour s'afficher. <a href="infini.html" target="_blank" rel="noopener">Le poème infini</a> s'en passe presque.</noscript>
<script>
(function () {
  const cadre = document.getElementById("scene");
  const origine = document.getElementById("origine");
  const son = document.getElementById("b-son");
  let fenetre = null;

  function aLaScene(m) { try { cadre.contentWindow.postMessage(m, "*"); } catch (e) { /* pas prete */ } }
  function prendreLaMain() { try { cadre.contentWindow.focus(); } catch (e) { /* tant pis */ } }
  cadre.addEventListener("load", prendreLaMain);

  // ce que la scene raconte : le poeme qui passe et la machine qui l'a ecrit (sous l'image)
  window.addEventListener("message", e => {
    if (e.source !== cadre.contentWindow) return;
    const m = e.data || {};
    if (m.type === "poiasie-poeme") {
      origine.textContent = "";
      if (m.machine) {
        const pastille = document.createElement("i");
        origine.appendChild(pastille);
        origine.appendChild(document.createTextNode(m.machine.toLowerCase()));
        if (m.titre) {
          const t = document.createElement("span");
          t.className = "titre";
          t.textContent = " · " + m.titre + (m.forme ? " (" + m.forme.toLowerCase() + ")" : "");
          origine.appendChild(t);
        }
        if (m.teinte != null) document.documentElement.style.setProperty("--teinte", m.teinte);
        origine.classList.add("vu");
        origine.title = [m.forme, m.date ? m.date.slice(0, 16).replace("T", " ") : ""].filter(Boolean).join(" · ");
      }
    } else if (m.type === "poiasie-son-etat") {
      son.setAttribute("aria-pressed", m.actif ? "true" : "false");
      son.textContent = m.actif ? "son allumé" : "son";
    } else if (m.type === "poiasie-son-bascule") {
      bascule();
    }
  });

  function bascule() { aLaScene({ type: "poiasie-son", actif: son.getAttribute("aria-pressed") !== "true" }); }
  son.addEventListener("click", () => { bascule(); prendreLaMain(); });
  document.getElementById("b-suivant").addEventListener("click", () => { aLaScene({ type: "poiasie-touche", key: " " }); prendreLaMain(); });
  function plein() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (cadre.requestFullscreen) cadre.requestFullscreen().catch(() => {});
  }
  document.getElementById("b-plein").addEventListener("click", plein);
  // le plein ecran garde la main de la scene
  document.addEventListener("fullscreenchange", prendreLaMain);

  // les touches qui arrivent a la page (le focus n'est pas dans la scene) sont passees a la scene
  window.addEventListener("keydown", e => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.target.closest && e.target.closest("button, a")) return;
    if (/^( |arrowleft|arrowright|enter|s|n|f|a|m)$/i.test(e.key)) {
      e.preventDefault();
      if (e.key.toLowerCase() === "f") plein(); else aLaScene({ type: "poiasie-touche", key: e.key });
    }
  });
})();
</script>
</body>
</html>
